name: Mosque Website Sync

on:
  schedule:
    - cron: '0 5 * * *'   # Daily 5 AM UTC — prayer + jummah times
    - cron: '0 6 * * 0'   # Sunday 6 AM UTC — events (weekly)
    - cron: '0 8 * * 5'   # Friday 8 AM UTC — pre-Jummah times refresh
  workflow_dispatch:
    inputs:
      scope:
        description: 'Sync scope'
        default: 'times'
        required: true
        type: choice
        options:
          - times
          - events
          - all

# Prayer + jummah times: daily and pre-Jummah Friday run
jobs:
  sync-times:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 5 * * *' ||
      github.event.schedule == '0 8 * * 5'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SYNC_SCOPE: ${{ github.event.inputs.scope || 'times' }}
    steps:
      - name: Trigger prayer & jummah times sync
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"scope":"times"}' \
            ${{ secrets.SUPABASE_URL }}/functions/v1/mosque-website-batch-sync

  # Events: weekly Sunday run only
  sync-events:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 6 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger events sync
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"scope":"events"}' \
            ${{ secrets.SUPABASE_URL }}/functions/v1/mosque-website-batch-sync
